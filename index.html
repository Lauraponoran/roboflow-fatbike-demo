<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fatbike Detector</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0e0e0e;
      --surface: #161616;
      --border: #2a2a2a;
      --text: #e8e8e8;
      --muted: #666;
      --accent: #c8f542;
      --accent-dim: rgba(200, 245, 66, 0.12);
      --font-mono: 'IBM Plex Mono', monospace;
      --font-sans: 'IBM Plex Sans', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 24px;
    }

    header {
      width: 100%;
      max-width: 720px;
      margin-bottom: 48px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 24px;
    }

    header h1 {
      font-family: var(--font-mono);
      font-size: 1.1rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      color: var(--accent);
      text-transform: uppercase;
    }

    header p {
      margin-top: 6px;
      font-size: 0.85rem;
      color: var(--muted);
      font-weight: 300;
    }

    .card {
      width: 100%;
      max-width: 720px;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 32px;
    }

    /* Mode toggle */
    #mode-toggle {
      display: flex;
      gap: 0;
      margin-bottom: 24px;
      border: 1px solid var(--border);
      width: fit-content;
    }

    .mode-btn {
      padding: 8px 20px;
      background: none;
      border: none;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .mode-btn.active {
      background: var(--accent);
      color: #0e0e0e;
    }

    .mode-btn:not(.active):hover {
      color: var(--text);
      background: var(--accent-dim);
    }

    /* Drop zone */
    #dropzone {
      border: 1px dashed var(--border);
      padding: 48px 24px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      position: relative;
    }

    #dropzone:hover, #dropzone.dragover {
      border-color: var(--accent);
      background: var(--accent-dim);
    }

    #dropzone input {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    #dropzone .icon {
      font-size: 2rem;
      margin-bottom: 12px;
      opacity: 0.4;
    }

    #dropzone p {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--muted);
    }

    #dropzone p span {
      color: var(--accent);
    }

    /* Camera section */
    #camera-section {
      display: none;
    }

    #video-wrap {
      position: relative;
      background: #000;
      line-height: 0;
    }

    #video {
      width: 100%;
      display: block;
    }

    /* Overlay canvas sits on top of video — must match video element pixels exactly */
    #video-canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .cam-controls {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    #start-camera-btn, #stop-camera-btn {
      flex: 1;
      padding: 12px;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: opacity 0.2s, background 0.2s;
    }

    #start-camera-btn {
      background: var(--accent);
      color: #0e0e0e;
      border-color: var(--accent);
    }

    #start-camera-btn:hover { opacity: 0.85; }
    #start-camera-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    #stop-camera-btn {
      background: none;
      color: var(--muted);
      display: none;
    }

    #stop-camera-btn:hover { color: var(--text); border-color: var(--text); }

    /* FPS indicator */
    #fps-indicator {
      display: none;
      margin-top: 10px;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--muted);
    }

    #fps-indicator span {
      color: var(--accent);
    }

    /* Preview (image mode) */
    #preview-wrap {
      display: none;
      position: relative;
    }

    #preview-wrap canvas {
      width: 100%;
      display: block;
    }

    /* Run button */
    #run-btn {
      display: none;
      margin-top: 20px;
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: #0e0e0e;
      border: none;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    #run-btn:hover { opacity: 0.85; }
    #run-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Status */
    #status {
      margin-top: 16px;
      font-family: var(--font-mono);
      font-size: 0.78rem;
      color: var(--muted);
      min-height: 1.2em;
    }

    #status.error { color: #ff6b6b; }
    #status.success { color: var(--accent); }

    /* Results */
    #results {
      display: none;
      margin-top: 28px;
      border-top: 1px solid var(--border);
      padding-top: 24px;
    }

    #results h2 {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 16px;
    }

    #detections {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .detection-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      background: var(--bg);
      border: 1px solid var(--border);
      font-family: var(--font-mono);
      font-size: 0.8rem;
      animation: fadeIn 0.3s ease forwards;
    }

    .detection-item .label { color: var(--text); }
    .detection-item .conf {
      color: var(--accent);
      font-size: 0.75rem;
    }

    .no-detections {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: var(--muted);
      padding: 10px 0;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Reset link */
    #reset {
      display: none;
      margin-top: 16px;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--muted);
      background: none;
      border: none;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    #reset:hover { color: var(--text); }
  </style>
</head>
<body>

<header>
  <h1>Fatbike // Small Object Detection</h1>
  <p>SAHI-based detection via Roboflow serverless inference</p>
</header>

<div class="card">

  <!-- Mode toggle -->
  <div id="mode-toggle">
    <button class="mode-btn active" data-mode="image">Image</button>
    <button class="mode-btn" data-mode="video">Live Video</button>
  </div>

  <!-- IMAGE MODE -->
  <div id="image-section">
    <div id="dropzone">
      <input type="file" id="file-input" accept="image/*" />
      <div class="icon">⊕</div>
      <p>Drop an image or <span>click to upload</span></p>
    </div>

    <div id="preview-wrap">
      <canvas id="canvas"></canvas>
    </div>

    <button id="run-btn">Run Detection</button>
  </div>

  <!-- VIDEO MODE -->
  <div id="camera-section">
    <div id="video-wrap">
      <video id="video" autoplay muted playsinline></video>
      <canvas id="video-canvas"></canvas>
    </div>
    <div class="cam-controls">
      <button id="start-camera-btn">Start Camera</button>
      <button id="stop-camera-btn">Stop</button>
    </div>
    <div id="fps-indicator">Sending frame every <span id="fps-val">3</span>s — free tier rate limiting</div>
  </div>

  <div id="status"></div>

  <div id="results">
    <h2>Detections</h2>
    <div id="detections"></div>
  </div>

  <button id="reset">← start over</button>
</div>

<script>
  const API_URL = 'https://roboflow-fatbike-demo.onrender.com/infer';
  // Interval between frames sent to API (ms). 3s is safe for free Render tier.
  const VIDEO_INTERVAL_MS = 3000;

  // Elements
  const dropzone     = document.getElementById('dropzone');
  const fileInput    = document.getElementById('file-input');
  const previewWrap  = document.getElementById('preview-wrap');
  const canvas       = document.getElementById('canvas');
  const ctx          = canvas.getContext('2d');
  const runBtn       = document.getElementById('run-btn');
  const statusEl     = document.getElementById('status');
  const resultsEl    = document.getElementById('results');
  const detectionsEl = document.getElementById('detections');
  const resetBtn     = document.getElementById('reset');
  const imageSection = document.getElementById('image-section');
  const cameraSection= document.getElementById('camera-section');
  const video        = document.getElementById('video');
  const videoCanvas  = document.getElementById('video-canvas');
  const vCtx         = videoCanvas.getContext('2d');
  const startCamBtn  = document.getElementById('start-camera-btn');
  const stopCamBtn   = document.getElementById('stop-camera-btn');
  const fpsIndicator = document.getElementById('fps-indicator');
  const fpsVal       = document.getElementById('fps-val');

  let currentImage  = null;
  let currentBase64 = null;
  let mode          = 'image'; // 'image' | 'video'
  let videoStream   = null;
  let videoTimer    = null;
  let inferring     = false;   // prevent overlapping requests

  fpsVal.textContent = (VIDEO_INTERVAL_MS / 1000).toFixed(0);

  // ── Mode toggle ──────────────────────────────────────────────────────────────
  document.querySelectorAll('.mode-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const m = btn.dataset.mode;
      if (m === mode) return;
      mode = m;
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === m));
      if (mode === 'image') {
        stopCamera();
        cameraSection.style.display = 'none';
        imageSection.style.display  = 'block';
        resultsEl.style.display     = 'none';
        resetBtn.style.display      = 'none';
        setStatus('');
      } else {
        cameraSection.style.display = 'block';
        imageSection.style.display  = 'none';
        resultsEl.style.display     = 'none';
        resetBtn.style.display      = 'none';
        setStatus('');
      }
    });
  });

  // ── Image mode ───────────────────────────────────────────────────────────────
  dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('dragover'); });
  dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
  dropzone.addEventListener('drop', e => {
    e.preventDefault();
    dropzone.classList.remove('dragover');
    const file = e.dataTransfer.files[0];
    if (file) loadImage(file);
  });
  fileInput.addEventListener('change', () => {
    if (fileInput.files[0]) loadImage(fileInput.files[0]);
  });

  function loadImage(file) {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        currentImage = img;
        canvas.width  = img.naturalWidth;
        canvas.height = img.naturalHeight;
        ctx.drawImage(img, 0, 0);
        // Hide dropzone, show preview
        dropzone.style.display      = 'none';
        previewWrap.style.display   = 'block';
        runBtn.style.display        = 'block';
        resultsEl.style.display     = 'none';
        resetBtn.style.display      = 'none';
        setStatus('');
      };
      img.src = e.target.result;
      currentBase64 = e.target.result.split(',')[1];
    };
    reader.readAsDataURL(file);
  }

  runBtn.addEventListener('click', async () => {
    runBtn.disabled = true;
    setStatus('Running inference…');
    resultsEl.style.display = 'none';
    try {
      const predictions = await runInference(currentBase64);
      ctx.drawImage(currentImage, 0, 0);
      drawBoxesOnContext(ctx, canvas.width, canvas.height, predictions);
      showDetections(predictions);
      setStatus(`${predictions.length} object${predictions.length !== 1 ? 's' : ''} detected`, 'success');
      resultsEl.style.display = 'block';
      resetBtn.style.display  = 'inline-block';
    } catch (err) {
      setStatus(`Error: ${err.message}`, 'error');
    } finally {
      runBtn.disabled = false;
    }
  });

  resetBtn.addEventListener('click', () => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    previewWrap.style.display = 'none';
    runBtn.style.display      = 'none';
    resetBtn.style.display    = 'none';
    resultsEl.style.display   = 'none';
    // Show dropzone again
    dropzone.style.display    = 'block';
    setStatus('');
    fileInput.value   = '';
    currentBase64     = null;
    currentImage      = null;
  });

  // ── Video mode ───────────────────────────────────────────────────────────────
  startCamBtn.addEventListener('click', startCamera);
  stopCamBtn.addEventListener('click', stopCamera);

  // Keep overlay canvas in sync with the displayed video size (not raw stream res)
  const videoResizeObserver = new ResizeObserver(() => {
    if (!videoStream) return;
    videoCanvas.width  = video.clientWidth;
    videoCanvas.height = video.clientHeight;
  });
  videoResizeObserver.observe(video);

  async function startCamera() {
    try {
      videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
      video.srcObject = videoStream;
      await video.play();

      // Set initial canvas size once video is visible
      video.addEventListener('loadedmetadata', () => {
        videoCanvas.width  = video.clientWidth;
        videoCanvas.height = video.clientHeight;
      }, { once: true });

      startCamBtn.disabled       = true;
      stopCamBtn.style.display   = 'inline-block';
      fpsIndicator.style.display = 'block';
      setStatus('Camera active — sending frames…');

      // Kick off polling
      scheduleNextFrame();
    } catch (err) {
      setStatus(`Camera error: ${err.message}`, 'error');
    }
  }

  function stopCamera() {
    if (videoTimer) { clearTimeout(videoTimer); videoTimer = null; }
    if (videoStream) {
      videoStream.getTracks().forEach(t => t.stop());
      videoStream = null;
    }
    video.srcObject = null;
    vCtx.clearRect(0, 0, videoCanvas.width, videoCanvas.height);
    startCamBtn.disabled       = false;
    stopCamBtn.style.display   = 'none';
    fpsIndicator.style.display = 'none';
    resultsEl.style.display    = 'none';
    setStatus('');
  }

  function scheduleNextFrame() {
    videoTimer = setTimeout(async () => {
      if (!videoStream || inferring) {
        scheduleNextFrame();
        return;
      }
      inferring = true;
      try {
        const base64 = captureVideoFrame();
        if (base64) {
          const predictions = await runInference(base64);
          // Redraw overlay — scale from raw video res → displayed canvas size
          vCtx.clearRect(0, 0, videoCanvas.width, videoCanvas.height);
          const scaleX = videoCanvas.width  / video.videoWidth;
          const scaleY = videoCanvas.height / video.videoHeight;
          drawBoxesOnContext(vCtx, videoCanvas.width, videoCanvas.height, predictions, scaleX, scaleY);
          showDetections(predictions);
          setStatus(`${predictions.length} object${predictions.length !== 1 ? 's' : ''} detected`, predictions.length > 0 ? 'success' : '');
          resultsEl.style.display = 'block';
        }
      } catch (err) {
        setStatus(`Error: ${err.message}`, 'error');
      } finally {
        inferring = false;
        if (videoStream) scheduleNextFrame(); // keep going only if camera still on
      }
    }, VIDEO_INTERVAL_MS);
  }

  function captureVideoFrame() {
    if (!video.videoWidth) return null;
    // Use a temporary off-screen canvas to grab the frame
    const tmp = document.createElement('canvas');
    tmp.width  = video.videoWidth;
    tmp.height = video.videoHeight;
    tmp.getContext('2d').drawImage(video, 0, 0);
    // Compress to JPEG at 0.8 quality to keep payload small for free tier
    return tmp.toDataURL('image/jpeg', 0.8).split(',')[1];
  }

  // ── Shared inference ─────────────────────────────────────────────────────────
  async function runInference(base64) {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ image: base64 })
    });
    if (!res.ok) throw new Error(`Server error: ${res.status}`);
    const data = await res.json();

    let predictions = [];
    const result = data.result;
    if (Array.isArray(result)) {
      for (const item of result) {
        if (item?.predictions?.predictions) predictions.push(...item.predictions.predictions);
        else if (item?.predictions) predictions.push(...(Array.isArray(item.predictions) ? item.predictions : []));
      }
    } else if (result?.predictions?.predictions) {
      predictions = result.predictions.predictions;
    } else if (result?.predictions) {
      predictions = result.predictions;
    }
    return predictions;
  }

  // ── Drawing ──────────────────────────────────────────────────────────────────
  // For video mode: API coords are in raw video resolution, canvas is display resolution.
  // Pass scaleX/scaleY to map between them. For image mode both are 1.
  function drawBoxesOnContext(context, canvasW, canvasH, predictions, scaleX = 1, scaleY = 1) {
    predictions.forEach(p => {
      const x = (p.x - p.width  / 2) * scaleX;
      const y = (p.y - p.height / 2) * scaleY;
      const w = p.width  * scaleX;
      const h = p.height * scaleY;
      const conf = Math.round((p.confidence || 0) * 100);

      context.strokeStyle = '#c8f542';
      context.lineWidth   = Math.max(1.5, canvasW * 0.003);
      context.strokeRect(x, y, w, h);

      const label    = `${p.class || 'object'} ${conf}%`;
      const fontSize = Math.max(11, Math.min(16, canvasW * 0.022));
      context.font      = `500 ${fontSize}px 'IBM Plex Mono', monospace`;
      const textW       = context.measureText(label).width;
      context.fillStyle = '#c8f542';
      context.fillRect(x, y - fontSize - 6, textW + 10, fontSize + 8);
      context.fillStyle = '#0e0e0e';
      context.fillText(label, x + 5, y - 4);
    });
  }

  function showDetections(predictions) {
    detectionsEl.innerHTML = '';
    if (predictions.length === 0) {
      detectionsEl.innerHTML = '<div class="no-detections">No objects detected.</div>';
      return;
    }
    predictions
      .sort((a, b) => b.confidence - a.confidence)
      .forEach(p => {
        const conf = Math.round((p.confidence || 0) * 100);
        const div  = document.createElement('div');
        div.className = 'detection-item';
        div.innerHTML = `<span class="label">${p.class || 'object'}</span><span class="conf">${conf}%</span>`;
        detectionsEl.appendChild(div);
      });
  }

  function setStatus(msg, type = '') {
    statusEl.textContent = msg;
    statusEl.className   = type;
  }
</script>
</body>
</html>
